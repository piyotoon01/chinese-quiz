<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>중국어 복습 퀴즈</title>
<link rel="icon" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="중국어 퀴즈">
<meta name="theme-color" content="#34507a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* 디자인: 먹빛 남색 + 동글동글 (10/11 사용자 선택 — 색은 D2, 모양은 듀오링고처럼 둥글고 통통하게) */
:root {
  --bg: #f3f5f8;
  --card: #ffffff;
  --ink: #1f2530;
  --muted: #6b7480;
  --line: #e1e5ea;
  --line-deep: #cdd3db;
  --accent: #34507a;
  --accent-deep: #22385a;
  --accent-ink: #ffffff;
  --accent-soft: #e5eaf2;
  --accent-line: rgba(52, 80, 122, .22);
  --ok: #3c7457;
  --ok-deep: #2d5a43;
  --ok-soft: #e4efe7;
  --warn: #9a7213;
  --warn-deep: #7a590c;
  --warn-soft: #f7efd9;
  --bad: #b5503f;
  --bad-deep: #8f3b2d;
  --bad-soft: #f8e6e2;
  --chip: #eef1f5;
  --seal: #b8432f; /* 도장 인주색 */
  --tag-bg: #f9ead9; --tag-ink: #b06318; /* 말하기 연습·연속 정답 표시 */
  --fs: 17px;
  --zh: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --round: "Nunito", "Noto Sans KR", sans-serif; /* 제목·숫자·버튼: 둥근 숫자 */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --card: #1d2128; --ink: #e8ebf0; --muted: #9aa3ae; --line: #2f3641; --line-deep: #262c35;
    --accent: #8fa9d8; --accent-deep: #5d79a8; --accent-ink: #121620; --accent-soft: #253049; --accent-line: rgba(143, 169, 216, .3);
    --ok: #7fbf98; --ok-deep: #5c9a75; --ok-soft: #1d3027; --warn: #d8b25c; --warn-deep: #b08b3b; --warn-soft: #362e1b;
    --bad: #e38f80; --bad-deep: #b86d5f; --bad-soft: #3a2420; --chip: #252a33; --seal: #e2806b; --tag-bg: #3a2a1a; --tag-ink: #e0a15c;
  }
}
:root[data-theme="dark"] {
  --bg: #14171c; --card: #1d2128; --ink: #e8ebf0; --muted: #9aa3ae; --line: #2f3641; --line-deep: #262c35;
  --accent: #8fa9d8; --accent-deep: #5d79a8; --accent-ink: #121620; --accent-soft: #253049; --accent-line: rgba(143, 169, 216, .3);
  --ok: #7fbf98; --ok-deep: #5c9a75; --ok-soft: #1d3027; --warn: #d8b25c; --warn-deep: #b08b3b; --warn-soft: #362e1b;
  --bad: #e38f80; --bad-deep: #b86d5f; --bad-soft: #3a2420; --chip: #252a33; --seal: #e2806b; --tag-bg: #3a2a1a; --tag-ink: #e0a15c;
}
:root.big { --fs: 20px; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); background: var(--bg);
  font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size: var(--fs); line-height: 1.6;
}
.wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
.zh { font-family: var(--zh); }
h1 { font-family: var(--round); font-size: 1.5em; font-weight: 900; margin: 8px 0 4px; letter-spacing: -.01em; }
.sub { color: var(--muted); margin: 0 0 20px; font-weight: 500; }
/* 카드: 두 줄 테두리 + 아래가 두툼한 동글동글한 판 */
.card {
  background: var(--card); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 20px;
  padding: 20px; margin-bottom: 16px;
}
.stat { display: flex; gap: 10px; }
.stat div { flex: 1; border: 2px solid var(--line); border-radius: 16px; padding: 10px 8px; text-align: center; }
.stat b { display: block; font-family: var(--round); font-size: 1.7em; font-weight: 900; line-height: 1.2; }
.stat span { color: var(--muted); font-size: .82em; font-weight: 700; }
button {
  font: inherit; color: inherit; cursor: pointer; border: 0; background: none;
  -webkit-tap-highlight-color: transparent;
}
/* 버튼: 아래로 눌리는 두께 */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
  min-height: 56px; padding: 12px 18px; border-radius: 16px; font-weight: 800; font-size: 1.05em;
  background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 var(--accent-deep); margin-bottom: 4px;
}
.btn:active { transform: translateY(4px); box-shadow: none; }
.btn:disabled { background: var(--line); color: var(--muted); box-shadow: 0 4px 0 var(--line-deep); cursor: default; }
.btn.ghost { background: var(--card); color: var(--accent); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); }
.btn + .btn { margin-top: 12px; }
.row { display: flex; gap: 10px; }
.row .btn { margin-top: 0; }
.link { color: var(--muted); font-weight: 700; font-size: .92em; padding: 10px 0 2px; width: 100%; text-align: center; }
.link.danger { color: var(--bad); }
.toggle {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 0; border-top: 2px solid var(--chip); font-weight: 700;
}
.toggle:first-of-type { border-top: 0; }
.toggle small { display: block; color: var(--muted); font-size: .82em; font-weight: 500; }
.switch { position: relative; width: 52px; height: 30px; flex: none; border-radius: 99px; background: var(--line-deep); transition: background .15s; }
.switch::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
  border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2);
}
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(22px); }
.switch:disabled { opacity: .4; cursor: default; }
.label { color: var(--muted); font-size: .85em; font-weight: 800; margin: 0 0 4px; }

/* 첫 화면 */
.hhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.hhead .sub { margin: 0; }
.icon { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 14px; border: 2px solid var(--line); border-bottom-width: 4px; background: var(--card); color: var(--muted); }
.icon svg { width: 22px; height: 22px; }
.plan { border-top: 2px solid var(--chip); margin-top: 16px; padding-top: 16px; }
.plan .t { font-family: var(--round); font-size: 1.25em; font-weight: 900; margin: 0; line-height: 1.4; }
.plan .s { color: var(--muted); font-weight: 500; margin: 2px 0 14px; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mini { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 16px; margin: 0; width: 100%; }
.mini .mi { font-size: 1.5em; line-height: 1.2; margin-bottom: 4px; }
.mini b { font-weight: 800; }
.mini small { color: var(--muted); font-weight: 500; font-size: .85em; }
button.mini:active { transform: translateY(2px); border-bottom-width: 2px; }
button.mini:disabled { cursor: default; }
button.mini:disabled .mi { filter: grayscale(1); opacity: .5; }
.pbar { width: 100%; height: 10px; border-radius: 99px; background: var(--chip); overflow: hidden; margin-top: 8px; }
.pbar i { display: block; height: 100%; border-radius: 99px; background: var(--ok); min-width: 10px; }

/* 문제 화면 */
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.top .back { font-size: 1.4em; width: 40px; height: 40px; border-radius: 50%; color: var(--muted); font-weight: 800; }
.top h1 { margin: 0; }
/* 진행 칸: 문제 수만큼 둥근 칸, 푼 칸은 결과대로 */
.cells { flex: 1; display: flex; gap: 4px; justify-content: center; }
.cells i { flex: 1; height: 14px; border-radius: 99px; background: var(--line); transition: background .2s; }
.cells i.now { box-shadow: inset 0 0 0 3px var(--accent); background: var(--card); }
.cells i.ok { background: var(--accent); }
.cells i.hint { background: var(--warn); }
.cells i.miss { background: var(--bad); }
.cells i.skip { background: var(--chip); }
.count { color: var(--muted); font-family: var(--round); font-weight: 900; font-size: .9em; white-space: nowrap; }
.qcard { padding: 4px 2px; border: 0; background: transparent; }
.qlabel { display: inline-block; margin: 0 0 8px; padding: 2px 10px; border-radius: 10px; background: var(--tag-bg); color: var(--tag-ink); font-size: .82em; font-weight: 800; }
.prompt { font-size: 1.25em; font-weight: 800; margin: 0 0 18px; line-height: 1.45; }
/* 단어는 둥근 田자 칸 안에 */
.big-zh {
  display: table; margin: 4px auto 18px; padding: 10px 28px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 20px; background-color: var(--card);
  font-family: var(--zh); font-size: 2.4em; font-weight: 700; text-align: center; line-height: 1.3;
  background-image:
    linear-gradient(90deg, transparent calc(50% - .5px), var(--accent-line) calc(50% - .5px), var(--accent-line) calc(50% + .5px), transparent calc(50% + .5px)),
    linear-gradient(transparent calc(50% - .5px), var(--accent-line) calc(50% - .5px), var(--accent-line) calc(50% + .5px), transparent calc(50% + .5px));
}
.big-py { text-align: center; color: var(--muted); margin-bottom: 8px; }
.sentence { font-family: var(--zh); font-size: 1.7em; font-weight: 700; text-align: center; margin: 4px 0 18px; letter-spacing: .02em; }
.choices { display: grid; gap: 12px; }
.choice {
  text-align: left; width: 100%; min-height: 58px; padding: 12px 16px; border-radius: 16px;
  border: 2px solid var(--line); border-bottom-width: 4px; background: var(--card); font-weight: 700;
  display: flex; gap: 14px; align-items: center;
}
.choice:active { transform: translateY(2px); border-bottom-width: 2px; }
.choice .n { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 8px; font-family: var(--round); font-weight: 900; font-size: .78em; color: var(--muted); }
.choice.zhc { font-family: var(--zh); font-size: 1.35em; font-weight: 500; }
.choice.picked { border-color: var(--bad); background: var(--bad-soft); color: var(--bad-deep); }
.choice.picked .n { border-color: var(--bad); color: var(--bad); }
.choice.right { border-color: var(--ok); background: var(--ok-soft); color: var(--ok-deep); }
.choice.right .n { border-color: var(--ok); color: var(--ok); }
.choice.gone { opacity: .35; text-decoration: line-through; pointer-events: none; }
.choice:disabled { cursor: default; }
.prevq { margin-top: 4px; }
input.answer {
  width: 100%; font-family: var(--zh); font-size: 1.6em; padding: 12px 14px; border-radius: 16px;
  border: 2px solid var(--line); background: var(--card); color: var(--ink); text-align: center;
}
input.answer:focus { outline: none; border-color: var(--accent); }
/* 카드 놓는 자리: 줄 노트처럼 — 카드가 놓인 줄 수만큼만 밑줄이 생긴다 (카드 52 + 줄 간격 8 = 한 줄 60) */
.slots {
  min-height: 60px; padding: 6px 0 2px; margin-bottom: 22px;
  background: repeating-linear-gradient(transparent 0 58px, var(--line) 58px 60px);
  display: flex; flex-wrap: wrap; gap: 8px 8px; align-content: flex-start;
}
.slots:empty::before { content: "아래 카드를 순서대로 눌러 주세요"; color: var(--muted); font-size: .88em; padding: 12px 2px; }
.pool { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.tile {
  font-family: var(--zh); font-size: 1.3em; font-weight: 500; height: 52px; padding: 0 14px; border-radius: 14px;
  background: var(--card); border: 2px solid var(--line); border-bottom-width: 4px;
}
.tile:active { transform: translateY(2px); border-bottom-width: 2px; }
.tile.used { background: var(--line); border-color: var(--line); color: transparent; pointer-events: none; }
.btn:focus-visible, .choice:focus-visible, .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.feedback { border-radius: 16px; padding: 16px; margin-top: 14px; }
.feedback.ok { background: var(--ok-soft); }
.feedback.hint { background: var(--warn-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback h3 { margin: 0 0 6px; font-size: 1.05em; font-weight: 800; }
.feedback.ok h3 { color: var(--ok); }
.feedback.hint h3 { color: var(--warn); }
.feedback.bad h3 { color: var(--bad); }
/* 정답 띠 — 화면 아래에 붙어서 올라온다 */
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; max-height: 80vh; overflow-y: auto;
  padding: 18px 16px calc(16px + env(safe-area-inset-bottom)); border-radius: 22px 22px 0 0;
  animation: up .25s ease-out;
}
.sheet-in { max-width: 528px; margin: 0 auto; }
.sheet.ok { background: var(--ok-soft); color: var(--ok-deep); }
.sheet.hint { background: var(--warn-soft); color: var(--warn-deep); }
.sheet.bad { background: var(--bad-soft); color: var(--bad-deep); }
.sheet h3 { margin: 0 0 6px; font-size: 1.3em; font-weight: 800; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sheet .full { background: transparent; padding: 0; margin: 4px 0 2px; }
.sheet .full .py, .sheet .rb rt { color: inherit; opacity: .75; }
.sheet .btn { margin-top: 14px; }
.sheet.ok .btn { background: var(--ok); box-shadow: 0 4px 0 var(--ok-deep); }
.sheet.hint .btn { background: var(--warn); box-shadow: 0 4px 0 var(--warn-deep); }
.sheet.bad .btn { background: var(--bad); box-shadow: 0 4px 0 var(--bad-deep); }
.sheet .speak { border-color: currentColor; }
.sheet .note { color: var(--ink); }
/* 글자 위 병음 */
.full .zh.rb { font-size: 1.3em; line-height: 2.3; }
.rb ruby { margin: 0 .08em; }
.rb rt { font-family: "Noto Sans KR", sans-serif; font-size: .5em; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.more { color: inherit; opacity: .8; font-size: .88em; font-weight: 800; padding: 6px 0 2px; }
.extra { padding-top: 2px; }
.report { text-align: center; }
.report textarea { width: 100%; box-sizing: border-box; margin-top: 8px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; font: inherit; font-size: .95em; resize: vertical; background: var(--card, #fff); color: var(--ink); }
.report .row { margin-top: 6px; }
.sheet .report .btn.ghost { background: var(--card); color: var(--ink); box-shadow: 0 4px 0 var(--line); }
.full { background: var(--chip); border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
.full .zh { font-size: 1.45em; font-weight: 700; line-height: 1.4; }
.full .py { color: var(--muted); }
.speak { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 12px; border: 2px solid var(--line); font-size: .85em; font-weight: 800; margin-top: 6px; }
.note { font-size: .92em; margin: 6px 0 0; }
.note b { font-weight: 700; }
.mt { margin-top: 14px; }
.list { list-style: none; padding: 0; margin: 0; }
.list li { padding: 12px 0; border-top: 2px solid var(--chip); }
.list li:first-child { border-top: 0; }
.list .zh { font-size: 1.25em; }
.tag { font-size: .78em; font-weight: 800; padding: 1px 8px; border-radius: 8px; margin-left: 6px; vertical-align: 2px; }
.tag.hint { background: var(--warn-soft); color: var(--warn); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.day { background: var(--chip); color: var(--muted); white-space: nowrap; display: inline-block; }
.nsec { margin: 18px 0 8px; }
.nudge { border-color: var(--bad); }
.install { border-color: var(--accent, #34507a); }
.install .t { font-family: var(--round); font-size: 1.15em; font-weight: 900; margin: 0; }
.install .s { color: var(--muted); margin: 4px 0 12px; }
.install .steps { list-style: none; padding: 0; margin: 0 0 4px; }
.install .steps li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 2px solid var(--chip); line-height: 1.55; }
.install .steps li:first-child { border-top: 0; }
.install .sn { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-size: .85em; margin-top: 1px; }
.install .shico { display: inline-block; width: 1.25em; height: 1.25em; vertical-align: -4px; color: #2f7cf6; }
.install .movebox { background: var(--chip); border-radius: 14px; padding: 12px; margin: 0 0 12px; }
.install .row .link { width: auto; flex: 1; }
.nudge .t { font-family: var(--round); font-size: 1.15em; font-weight: 900; margin: 0; }
.nudge .s { color: var(--muted); margin: 4px 0 12px; }
.foot { color: var(--muted); font-size: .8em; text-align: center; margin-top: 24px; }

/* 오답 노트 */
.nhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.nzh { font-size: 1.7em; font-weight: 700; line-height: 1.3; }
.ncard .py { color: var(--muted); }
.play.small { width: 48px; height: 48px; font-size: 1.25em; border-radius: 14px; }
.nmiss { background: var(--chip); border-radius: 14px; padding: 10px 12px; margin-top: 10px; font-size: .92em; }
.nmiss .q { color: var(--muted); margin: 0 0 2px; font-size: .9em; font-weight: 700; }
.nsent { border-top: 2px solid var(--card); margin-top: 8px; padding-top: 8px; }
.nsent .zh { font-size: 1.2em; }
.nrow { display: flex; gap: 10px; margin-top: 4px; }
.nrow b { flex: none; width: 2.8em; font-weight: 800; }
.nrow.mine { color: var(--bad); }
.nrow.right b { color: var(--ok); }

/* 듣기 문제 */
.listen { display: flex; align-items: center; gap: 16px; margin: 4px 0 18px; }
.play { width: 72px; height: 72px; flex: none; border-radius: 20px; background: var(--accent); color: var(--accent-ink); font-size: 1.9em; box-shadow: 0 4px 0 var(--accent-deep); }
.play:active { transform: translateY(4px); box-shadow: none; }
.listen .note { margin: 0 0 4px; color: var(--muted); }

/* 반응 효과 */
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.025); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
.pop { animation: pop .35s ease-out; }
.shake { animation: shake .4s ease-in-out; }
.feedback { animation: rise .25s ease-out; }
.feedback h3 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tick { width: 26px; height: 26px; flex: none; }
.tick circle { fill: var(--ok); }
.tick path { fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 16; stroke-dashoffset: 16; animation: draw .3s .1s ease-out forwards; }
.combo { margin-left: auto; background: var(--tag-bg); color: var(--tag-ink); border-radius: 10px; padding: 1px 10px; font-size: .75em; font-weight: 800; animation: rise .3s ease-out; }

/* 결과 도장 */
.rhead { position: relative; padding-right: 116px; min-height: 100px; }
.stamp { position: absolute; right: 0; top: -2px; width: 108px; height: 108px; transform: rotate(-12deg); pointer-events: none; animation: stamp .5s cubic-bezier(.25, 1.3, .5, 1) .2s both; }
.stamp svg { display: block; width: 100%; height: 100%; overflow: visible; }
.stamp circle { stroke: var(--seal); }
.stamp text { fill: var(--seal); font-family: "Noto Sans KR", sans-serif; font-weight: 800; }
.stamp text.d { font-weight: 500; letter-spacing: .06em; }
@keyframes stamp { 0% { opacity: 0; transform: scale(2.2) rotate(-12deg); } 70% { opacity: 1; transform: scale(.94) rotate(-12deg); } 100% { transform: scale(1) rotate(-12deg); } }

/* 이번 주 도장 */
.streak .line { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

<script>
"use strict";
(() => {
const ITEMS = window.ITEMS || [];
const AUTHORED = window.AUTHORED || [];
const NEAR = window.NEAR || {}; // 예문 → 정답과 한 군데만 다른 오답 뜻 3개 (없으면 다른 예문의 뜻으로)
const byId = new Map(ITEMS.map(it => [it.id, it]));
const byH = new Map(ITEMS.map(it => [it.h, it]));
const INTERVAL = [1, 3, 7, 14, 30]; // 복습 횟수 0회→1일, 1회→3일, 2회→7일, 3회→14일, 4회 이상→30일
const LEVELS = ["새로 배움", "애매함", "익숙함"];

// ---------- 저장 ----------
const KEY = "cnquiz.v1";
const SESSION_V = 2; // 세션에 저장되는 문제 형식이 바뀌면 올린다 — 예전 세션은 푼 것만 기록하고 버린다
let STORAGE_OK = true; // 사생활 보호 모드·일부 앱 안 브라우저는 저장이 막혀 있다
function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { STORAGE_OK = false; return {}; }
}
try { localStorage.setItem(KEY + ".test", "1"); localStorage.removeItem(KEY + ".test"); } catch (e) { STORAGE_OK = false; }
const db = Object.assign({ prog: {}, settings: {}, session: null, days: [], notes: {} }, load());
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { STORAGE_OK = false; } }
// 브라우저가 저장 공간이 모자랄 때 이 사이트 기록부터 지우지 않게 부탁한다 (안 되는 브라우저는 그냥 넘어감)
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
const S = db.settings;

// ---------- 날짜 ----------
const pad = n => String(n).padStart(2, "0");
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => fmt(new Date());
function addDays(str, n) { const d = new Date(str + "T00:00:00"); d.setDate(d.getDate() + n); return fmt(d); }
function daysBetween(a, b) { return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 864e5); }
function koDate(str) {
  const d = new Date(str + "T00:00:00");
  return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${"일월화수목금토"[d.getDay()]})`;
}
// rc 복습 횟수 / wc 틀린 횟수 / lv 숙련도 0~2 / due 다음 복습일 / last 마지막 결과("ok"·"bad")
function prog(id) { return db.prog[id] || { rc: 0, wc: 0, lv: 0, due: null }; }
function isSeen(id) { return !!db.prog[id]; }                         // 이 퀴즈에서 한 번이라도 푼 항목
function isDue(id) { const p = prog(id); return !p.due || p.due <= today(); }
function isReviewDue(id) { return isSeen(id) && isDue(id); }          // 이미 푼 항목 중 복습할 때가 된 것

// ---------- 도우미 ----------
const rnd = n => Math.floor(Math.random() * n);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of flat(kids)) if (k != null && k !== false) e.append(k.nodeType ? k : String(k));
  return e;
}
// 오래된 아이폰(iOS 12~13)에도 있는 기능만 쓴다 — Array.flat / replaceChildren 대신
function flat(a) { return a.reduce((o, k) => o.concat(Array.isArray(k) ? flat(k) : [k]), []); }
function fill(node, ...kids) {
  node.textContent = "";
  for (const k of flat(kids)) if (k != null && k !== false) node.append(k.nodeType ? k : String(k));
}
const norm = s => String(s || "").replace(/[\s，。？！、,.?!；;：:“”"'（）()…]/g, "");
const PURE_ZH = /^[一-鿿]+[？！]?$/;
const ZH_ONLY = s => s.replace(/[？！]/g, "");

// 출처 → 주제 (같은 주제 4문제 제한·범위 분산용)
function topic(src) {
  const rules = [
    [/Lesson 5/, "식사·약속"], [/Lesson 4/, "가격·쇼핑"], [/Lesson 3/, "양사·허락"], [/Lesson 2/, "길 묻기"], [/교통/, "교통"],
    [/양사/, "양사"], [/연결표현/, "연결 표현"], [/정도부사/, "정도부사"], [/청유형/, "제안"],
    [/문장순서/, "어순"], [/빨간책/, "기초 단어"], [/1음절/, "1음절 단어"], [/드라마/, "드라마 표현"],
    [/작문/, "작문 표현"], [/Claude/, "회화 표현"], [/새 표현/, "새 표현"], [/수업/, "수업 표현"],
    [/새 교재/, "새 교재"], [/기초편/, "기초편"]
  ];
  for (const [re, name] of rules) if (re.test(src)) return name;
  return src || "기타";
}
// 세트 고르기용 묶음 — '기초편'은 전체 항목의 절반이 넘어서, 한 묶음으로 두면 '같은 주제 4개까지'에 막혀
// 작은 주제(연결 표현·수업 표현 등) 항목만 자꾸 나온다. 소주제(동사·날짜…)나 배운 달로 나눈다
function group(it) {
  const tp = topic(it.src);
  if (tp !== "기초편") return tp;
  return "기초편 " + (it.src.replace(/^.*기초편\s*/, "").trim() || (it.d || "").slice(0, 7));
}

// ---------- 병음 ----------
const TONED = { a: "āáǎà", e: "ēéěè", i: "īíǐì", o: "ōóǒò", u: "ūúǔù", "ü": "ǖǘǚǜ" };
const VOWEL = {};
for (const [b, s] of Object.entries(TONED)) { VOWEL[b] = [b, 0]; [...s].forEach((c, i) => (VOWEL[c] = [b, i + 1])); }
function segments(py) {
  const out = []; let cur = null;
  for (const ch of py.toLowerCase()) {
    const isV = ch in VOWEL;
    if (!cur || cur.v !== isV) { cur = { v: isV, s: "" }; out.push(cur); }
    cur.s += ch;
  }
  return out;
}
function runTone(run) { for (const c of run) if (VOWEL[c][1]) return VOWEL[c][1]; return 0; }
function setTone(run, t) {
  const base = [...run].map(c => VOWEL[c][0]).join("");
  if (!t) return base;
  let i = base.indexOf("a");
  if (i < 0) i = base.indexOf("e");
  if (i < 0 && base.includes("ou")) i = base.indexOf("o");
  if (i < 0) i = base.length - 1;
  return base.slice(0, i) + TONED[base[i]][t - 1] + base.slice(i + 1);
}
function tones(py) { return segments(py).filter(s => s.v).map(s => runTone(s.s)); }
function tonePattern(py) {
  const t = tones(py);
  if (!t.length) return "";
  let s = t.map(n => (n ? n + "성" : "경성")).join("-");
  for (let i = 0; i + 1 < t.length; i++) if (t[i] === 3 && t[i + 1] === 3) { s += " (3성이 이어지면 앞의 3성은 2성처럼 읽어요)"; break; }
  return s;
}
// keep: 바꾸지 않을 음절 순번(0부터) — 不·一 처럼 뒤 글자에 따라 성조가 바뀌는 글자는 사전 표기(bù, yī)가
// 오답 보기로 나오면 헷갈리므로 건드리지 않는다
// 실제로 나는 소리의 성조: 3성이 이어지면 앞의 3성은 2성으로 읽는다
// 3성이 셋 이어지면 끊어 읽는 방식에 따라 결과가 달라서 앞에서부터·뒤에서부터 두 가지를 모두 본다
function surfaces(ts) {
  const f = ts.slice(), b = ts.slice();
  for (let i = 0; i + 1 < f.length; i++) if (f[i] === 3 && f[i + 1] === 3) f[i] = 2;
  for (let i = b.length - 2; i >= 0; i--) if (b[i] === 3 && b[i + 1] === 3) b[i] = 2;
  return [f.join(""), b.join("")];
}
function toneVariants(py, keep) {
  const seg = segments(py);
  // 바꾸지 않는 음절: keep(不·一) 과 경성 — 경성을 본래 성조로 바꾼 보기(péngyǒu)는 사전식으로는 맞아서 정답이 둘이 된다
  const idx = seg.map((s, i) => (s.v ? i : -1)).filter(i => i >= 0)
    .filter((i, n) => !(keep && keep.has(n)) && runTone(seg[i].s) !== 0);
  const orig = seg.map(s => s.s).join(""), out = new Set();
  const build = (changes) => seg.map((s, i) => (i in changes ? setTone(s.s, changes[i]) : s.s)).join("");
  // 2·3성 맞바꾸기를 먼저 (가장 헷갈리는 조합)
  idx.forEach(i => { const t = runTone(seg[i].s); if (t === 2 || t === 3) out.add(build({ [i]: 5 - t })); });
  idx.forEach(i => { for (let t = 1; t <= 4; t++) if (t !== runTone(seg[i].s)) out.add(build({ [i]: t })); });
  if (idx.length > 1) for (let k = 0; k < 6; k++) { const ch = {}; idx.forEach(i => (ch[i] = 1 + rnd(4))); out.add(build(ch)); }
  out.delete(orig);
  // 3성 변조 때문에 정답과 같은 소리가 나는 보기는 뺀다 (nǐ hǎo 와 ní hǎo, píngguǒ 와 pǐngguǒ)
  const same = surfaces(tones(orig));
  const arr = [...out].filter(v => !surfaces(tones(v)).some(s => same.includes(s)));
  return shuffle(arr.slice(0, 2).concat(shuffle(arr.slice(2))).slice(0, 3));
}

// ---------- 문제 만들기 ----------
const KIND_LABEL = {
  meaning_mc: "뜻 맞히기", hanzi_mc: "간체자 고르기", hanzi_input: "간체자 쓰기", tone_mc: "성조 고르기",
  fill_mc: "빈칸 채우기", fill_input: "빈칸 채우기", order: "어순 배열", translate: "중국어로 옮기기",
  situation: "상황 표현", speak: "말하기 연습", sentence_mc: "예문 뜻 고르기", cloze_mc: "예문 빈칸 채우기",
  listen_word: "듣고 고르기", listen_sent: "듣고 뜻 고르기"
};
// 같은 유형 몇 문제까지 제한할 때 묶어서 세는 이름
const TYPE_OF = k => (k === "fill_mc" || k === "fill_input" ? "fill" : k.startsWith("listen") ? "listen" : k);
const IS_MC = k => ["meaning_mc", "hanzi_mc", "tone_mc", "fill_mc", "cloze_mc", "situation", "sentence_mc", "listen_word", "listen_sent"].includes(k);
const IS_TILE = k => k === "order" || k === "translate" || k === "speak"; // 카드를 눌러 문장을 만드는 문제

function simpleWord(it) {
  return PURE_ZH.test(it.h) && it.p && !/[+/…()（]/.test(it.p);
}
function isNewExpr(it) { return /새 표현/.test(it.src) && prog(it.id).rc <= 2; }

// 자동 문제에서 뺄 항목
const AUTO_SKIP = new Set(["连动文", "麻"]);                       // 문법 용어, 성조 연습용 글자
const WORD_SKIP = new Set(["的", "吧", "呢", "吗", "和"]);         // 뜻·간체자 맞히기에 맞지 않는 조사 — 예문 문제로만 낸다
const LISTEN_SKIP = new Set(["只", "支", "还", "几"]);             // 한 글자만 읽히면 음성이 다른 소리로 읽기도 한다 (只 zhī, 还 huán, 几 jī)
// 이 기기에서 '소리가 이상해요'를 누른 말 — 다음부터 듣기 문제로 내지 않는다 (설정 화면에 목록이 남는다)
const oddSound = t => (S.odd || []).includes(ZH_ONLY(String(t)));
// 过 는 경성 조사(guo, 경험)만 빼고 '지나다'(guò)는 낸다
const isParticle = it => WORD_SKIP.has(ZH_ONLY(it.h)) || (ZH_ONLY(it.h) === "过" && !tones(it.p).some(t => t));
const autoOk = it => simpleWord(it) && !AUTO_SKIP.has(ZH_ONLY(it.h)) && !isParticle(it);

// 문제에 보여 줄 뜻: 한자·병음이 든 괄호 메모, ' — ' 뒤 설명, 발음 메모를 뺀다 (정답이 보이거나 지시문이 길어지지 않게)
function dm(it) {
  const m = String(it.m || "").split(/\s+—\s+/)[0]
    .replace(/\s*\([^()]*[A-Za-z一-鿿][^()]*\)/g, "")
    .replace(/\s*\((얼화음|경성|[1-4]성)\)/g, "").trim();
  return m || it.m;
}
// 받침에 맞는 조사: josa('여기', '이에요', '예요') → 예요
function hasBatchim(w) {
  // 끝의 괄호 설명은 소리 내 읽지 않으니 그 앞 글자로 본다: '개 (동물)' → 개
  let s = String(w);
  while (/\s*\([^()]*\)\s*$/.test(s)) s = s.replace(/\s*\([^()]*\)\s*$/, "");
  s = s.replace(/[\s'"’)\]）.!?~…]+$/, "");
  const c = s.charAt(s.length - 1), code = c.charCodeAt(0);
  if (code >= 0xac00 && code <= 0xd7a3) return (code - 0xac00) % 28 !== 0;
  if (/\d/.test(c)) return "013678".includes(c); // 영·일·삼·육·칠·팔
  return false;
}
const josa = (w, a, b) => (hasBatchim(w) ? a : b);

// 뜻이 겹치는 항목끼리는 서로의 오답 보기로 쓰지 않는다 (정답이 둘이 되지 않게)
const SYN = [["二", "两"], ["很", "非常", "特别", "真", "真的"], ["这儿", "这里"], ["那儿", "那里"], ["周", "星期"], ["日", "号"],
  ["但是", "可是"], ["看看", "看一下"], ["等等", "等一下", "等我一下"], ["妈", "妈妈"], ["好看", "好漂亮"], ["一刻", "十五分"], ["半", "三十分"],
  ["狗", "个"], ["他", "那"], ["它", "那", "那个"], ["唱", "唱歌"], ["做饭", "做菜"], ["家", "家里"], ["里", "里边儿"], ["旁边", "旁边儿"], ["分", "分钟"],
  ["就", "一直"], ["几", "多少", "多"], ["要", "需要", "想"], ["没关系", "不客气", "可以", "不错", "还可以", "还不错", "没问题"], ["你好", "您好", "再见", "慢走"],
  ["而且", "还有"], ["真的", "真的吗"], ["虽然", "但是", "可是", "不过"], ["走", "走路"], ["白", "白色"], ["学", "学习"], ["说", "告诉"], ["高兴", "快乐"],
  ["条", "件"], ["姓", "贵姓"], ["坏", "破"], ["菜", "饭"], ["早上", "上午"], ["多少", "钱"]];
// 한 글자가 여러 무리에 들어 있을 수 있으니 무리들을 합쳐서 본다 (那, 真的, 但是, 要, 多少 …)
const synOf = new Map();
SYN.forEach(g => g.forEach(h => { if (!synOf.has(h)) synOf.set(h, new Set()); g.forEach(x => synOf.get(h).add(x)); }));
const inSyn = (a, b) => synOf.has(a) && synOf.get(a).has(b);
// 뜻 낱말: 어미를 떼서 '괜찮다·괜찮아·괜찮네', '안녕·안녕히' 를 같은 말로 본다
// 한 글자 낱말은 풀이 하나가 통째로 한 글자일 때만 비교한다 ('개', '그, 저'의 그) — '걸터타는 것'의 것, '~에 다니다'의 에 는 버린다
const stem = t => t.replace(/(습니다|세요|어요|아요|해요|하다|이다|네|다|아|어|요|히)$/, "") || t;
function mTokens(m) {
  const out = [];
  String(m || "").split(/[,，/·]/).forEach(g => {
    const words = g.split(/[\s()（）~.?!？…]+/).filter(Boolean).map(stem).filter(Boolean);
    words.forEach(w => { if (w.length >= 2 || /\d/.test(w)) out.push(w); });
    if (words.length === 1 && words[0].length === 1) out.push(words[0]);
  });
  return out;
}
const TOK = new Map(ITEMS.map(it => [it.id, new Set(mTokens(dm(it)))])); // 항목이 많아 미리 계산해 둔다
function clash(a, b) {
  const ha = ZH_ONLY(a.h), hb = ZH_ONLY(b.h);
  if (ha === hb || a.m === b.m || inSyn(ha, hb) || inSyn(hb, ha)) return true;
  const ta = TOK.get(a.id);
  for (const t of TOK.get(b.id)) if (ta.has(t)) return true;
  return false;
}
// 뜻만 보고 쓰는 문제에서 함께 정답으로 받아 줄 간체자 — 뜻이 글자까지 같거나 정말 같은 말(SAME)일 때만
// SYN 은 '오답 보기에서 빼기'용이라 넓다(很·非常·特别). '뜻 낱말을 모두 포함'까지 받으면 '주말'에 上周末가 정답이 된다
const SAME = [["这儿", "这里"], ["那儿", "那里"], ["妈", "妈妈"], ["周", "星期"], ["但是", "可是"], ["看看", "看一下"], ["等等", "等一下"],
  ["旁边", "旁边儿"], ["但是", "可是", "不过"], ["里", "里边儿", "里边", "里面"], ["一刻", "十五分"], ["半", "三十分"], ["三刻", "四十五分"], ["点儿", "一点儿"], ["汉语", "中文"],
  ["唱", "唱歌"]];
function sameMeaning(it) {
  const h = ZH_ONLY(it.h);
  const group = SAME.filter(g => g.includes(h)).reduce((a, g) => a.concat(g), []); // 항목에 없는 말(十五分)도 받는다
  const items = ITEMS.filter(o => o.id !== it.id && simpleWord(o) && o.m === it.m).map(o => ZH_ONLY(o.h));

  }, mcOf(it.h, pickOthers(it, 3, o => o.h, [o => group(o) === group(it) && ZH_ONLY(o.h).length === len, o => ZH_ONLY(o.h).length === len]))));
  if (S.kbd) {
    const exZh = (EXP.get(it.id) || {}).h || ""; // 형식이 맞는 예문의 중국어 부분만 (병음이 힌트에 새지 않게)
    const tp = tonePattern(it.p).split(" ")[0];
    const hint = exZh.includes(ZH_ONLY(it.h)) && exZh !== it.h
      ? `예문 속에서 떠올려 보세요: ${exZh.split(ZH_ONLY(it.h)).join("＿".repeat(len))}`
      : `${len}글자예요. 성조는 ${tp}${josa(tp, "이에요", "예요")}.`;
    qs.push(Object.assign({}, base, { kind: "hanzi_input", prompt: `'${m}'${josa(m, "을", "를")} 간체자로 써 보세요.`, accept: [ZH_ONLY(it.h)].concat(sameMeaning(it)), hint }));
  }
  const py = it.p.replace(/[?？!！.。]/g, "").trim();
  // 같은 글자의 다른 읽기(过 guo/guò, 只 zhī 등)는 오답 보기로 쓰지 않는다
  const otherReadings = new Set(ITEMS.filter(o => o.id !== it.id && ZH_ONLY(o.h) === ZH_ONLY(it.h)).map(o => o.p.replace(/[?？!！.。]/g, "").trim().toLowerCase())
    .concat(len === 1 ? POLY[ZH_ONLY(it.h)] || [] : []));
  // 글자 수와 음절 수가 같을 때만 不·一 자리를 알 수 있다. 다르면 不·一 이 든 단어는 성조 문제를 내지 않는다
  const chars = [...ZH_ONLY(it.h)], nSyl = tones(py).length, keep = new Set();
  chars.forEach((c, i) => { if (c === "不" || c === "一") keep.add(i); });
  const toneOk = !keep.size || chars.length === nSyl;
  const vars = toneOk ? toneVariants(py, keep).filter(v => !otherReadings.has(v)) : [];
  if (tones(py).some(t => t) && vars.length === 3) {
    const t = tones(py);
    // 보기는 정답과 같은 대소문자로 (고유명사 첫 글자만 대문자인 경우). 안쪽에도 대문자가 있으면(Tiān'ān Mén) 모두 소문자로
    const inner = py.slice(1) !== py.slice(1).toLowerCase();
    const cased = v => (inner ? v : py.charAt(0) !== py.charAt(0).toLowerCase() ? v.charAt(0).toUpperCase() + v.slice(1) : v);
    const t0 = t[0] ? t[0] + "성" : "경성";
    qs.push(Object.assign({}, base, {
      kind: "tone_mc", prompt: "이 말의 병음으로 맞는 것은?", showH: it.h,
      hint: t.length > 1 ? `첫 글자는 ${t0}${josa(t0, "이에요", "예요")}. (뜻: ${m})` : `뜻은 '${m}'${josa(m, "이에요", "예요")}. 소리를 떠올려 보세요.`
    }, mcOf(inner ? py.toLowerCase() : py, vars.map(cased))));
  }
  if (listenOn()) {
    const others = listenWord(it);
    if (others.length === 3) qs.push(Object.assign({}, base, {
      kind: "listen_word", prompt: "잘 듣고, 들은 말을 고르세요.", listen: ZH_ONLY(it.h),
      hint: "천천히 다시 들려 드릴게요. 보기 두 개를 지웠어요."
    }, mcOf(it.h, others)));
  }
  return qs;
}
// 손으로 쓴 객관식은 정답을 첫 칸에 적은 게 많아서(10/17 사용자: '정답이 거의 1번') 낼 때마다 보기를 섞는다
function authoredFor(it) {
  return AUTHORED.filter(q => q.item === it.h && q.kind !== "speak").map(q => {
    const o = Object.assign({ itemId: it.id }, q);
    if (q.choices) Object.assign(o, mcOf(q.choices[q.answer], q.choices.filter((c, i) => i !== q.answer)));
    return o;
  });
}
// 문제를 실제로 만들지 않고 낼 수 있는 문제가 있는지만 본다 (첫 화면·출제 후보 고르기용)
const AUTH_KINDS = new Map();
AUTHORED.filter(q => q.kind !== "speak").forEach(q => AUTH_KINDS.set(q.item, (AUTH_KINDS.get(q.item) || []).concat(q.kind)));
function hasQuestions(it) {
  return autoOk(it) || !!EXP.get(it.id) || (AUTH_KINDS.get(it.h) || []).some(k => S.kbd || k !== "fill_input");
}
function questionsFor(it) {
  const auth = authoredFor(it).filter(q => S.kbd || q.kind !== "fill_input");
  // 새 표현은 복습 2회까지 뜻 맞히기·예문 읽기·상황 고르기만
  if (isNewExpr(it)) return autoQuestions(it).concat(exQuestions(it, true), auth.filter(q => q.kind === "situation"));
  return autoQuestions(it).concat(exQuestions(it, false), clozeQuestions(it), auth);
}

// ---------- 출제 대상 고르기 ----------
// 1순위 마지막에 틀린 항목, 2순위 숙련도 '새로 배움·애매함', 3순위 나머지 (지침의 우선순위)
// '한 번이라도 틀림'으로 두면 그 항목들이 영원히 앞을 차지해서 맞힌 항목의 복습 차례가 밀린다
function priority(it) { const p = prog(it.id); return p.last === "bad" ? 0 : p.lv < 2 ? 1 : 2; }
function pickItems(n) {
  const t = today();
  const cand = ITEMS.filter(hasQuestions);
  const byDue = (a, b) => (prog(a.id).due || "").localeCompare(prog(b.id).due || "");
  // 복습할 때가 된 항목: 우선순위 → 오래 밀린 순 (같으면 섞어서)
  const due = shuffle(cand.filter(it => isReviewDue(it.id))).sort((a, b) => priority(a) - priority(b) || byDue(a, b));
  const unseen = shuffle(cand.filter(it => !isSeen(it.id)));        // 아직 이 퀴즈에서 안 푼 항목
  const later = cand.filter(it => isSeen(it.id) && !isDue(it.id)).sort(byDue);
  // 복습이 밀려 있어도 안 푼 항목이 세트마다 몇 개씩은 섞여 들어오게 사이사이에 끼운다
  const newSlots = Math.min(unseen.length, Math.max(2, Math.round(4 * n / 15)));
  const every = Math.max(1, Math.floor(n / Math.max(1, newSlots)));
  const head = [];
  let di = 0, ui = 0;
  while (di < due.length || ui < newSlots) {
    const slot = ui < newSlots && (head.length % every === every - 1 || di >= due.length);
    head.push(slot ? unseen[ui++] : due[di++]);
  }
  const ordered = head.concat(unseen.slice(ui), later);
  const isOld = it => it.d && daysBetween(it.d, t) >= 21;
  const isRecent = it => it.d && daysBetween(it.d, t) < 14;
  // 10/29 사용자: 새로 배운 건 업데이트 다음 날 바로 한 세트로 풀어 보고 싶다
  // → 최근 2주 안에 배웠는데 아직 안 푼 항목은 최신순으로 세트 맨 앞에 (주제당 4개·최근 것 제한을 받지 않는다)
  const fresh = unseen.filter(isRecent).sort((a, b) => b.d.localeCompare(a.d)).slice(0, n);
  const isGram = it => it.t !== "단어";
  const isSitu = it => authoredFor(it).some(q => q.kind === "situation" || q.kind === "translate");
  const scale = n / 15;
  const need = { old: Math.round(8 * scale), recentMax: Math.max(2, Math.round(4 * scale)), topics: Math.round(6 * scale), gram: Math.round(4 * scale), word: Math.round(4 * scale), situ: Math.round(5 * scale) };

  function run(strict) {
    const picked = fresh.slice(), topicN = {};
    picked.forEach(it => { topicN[group(it)] = (topicN[group(it)] || 0) + 1; });
    let old = 0, recent = 0, gram = 0, situ = 0;
    for (const it of ordered) {
      if (picked.length >= n) break;
      if (picked.includes(it)) continue;
      const tp = group(it);
      if ((topicN[tp] || 0) >= 4) continue;
      if (isRecent(it) && recent >= need.recentMax) continue;
      if (strict) {
        const left = n - picked.length;
        const distinct = Object.keys(topicN).length;
        if (left <= need.old - old && !isOld(it)) continue;
        if (left <= need.topics - distinct && topicN[tp]) continue;
        if (left <= need.gram - gram && !isGram(it)) continue;
        if (left <= need.word - (picked.length - gram) && isGram(it)) continue;
        if (left <= need.situ - situ && !isSitu(it)) continue;
      }
      picked.push(it); topicN[tp] = (topicN[tp] || 0) + 1;
      if (isOld(it)) old++; if (isRecent(it)) recent++; if (isGram(it)) gram++; if (isSitu(it)) situ++;
    }
    return picked;
  }
  let picked = run(true);
  if (picked.length < n) for (const it of run(false)) { if (picked.length >= n) break; if (!picked.includes(it)) picked.push(it); }
  if (picked.length < n) for (const it of ordered) { if (picked.length >= n) break; if (!picked.includes(it)) picked.push(it); }
  return picked;
}

// 10/31 사용자: 같은 문장이 너무 자주 나와 재미가 없다 (30일 시뮬레이션: 34%가 7일 안에 다시 나온 문장)
// → 문제에 보이는 문장을 기기에 '마지막으로 본 날'로 남겨 두고, 최근에 본 문장은 뒤로·오래 안 본 문장은 앞으로
// 한 문장이 여러 단어의 문제(你花了多少钱 → 花·多少·钱)로 돌아오는 것도 같이 막힌다
function sentKey(q) {
  const k = q.sentence || (q.showH && ZH_ONLY(q.showH).length > 3 ? q.showH : "") || (q.full && q.full.h) || "";
  return ZH_ONLY(k.replace(/[＿_]/g, ""));
}
function staleness(q) {
  const last = (db.shown || {})[sentKey(q)];
  if (!last) return 1.2;                // 이 기기에서 처음 보는 문장
  const days = daysBetween(last, today());
  return days < 3 ? -4 : days < 7 ? -2.5 : days < 14 ? -1 : Math.min(1, (days - 14) / 30);
}

function assignQuestions(items) {
  const n = items.length, typeN = {};
  let build = 0, mc = 0, situ = 0, tiles = 0;
  const targetBuild = Math.floor(n / 2), targetSitu = Math.round(n * 5 / 15);
  const typeCap = Math.max(2, Math.round(n * 4 / 15)); // 15문제 기준 한 유형 4문제까지
  const tileCap = 1; // 카드 문제는 말하기에 2개가 따로 있으니 복습에서는 1개까지
  const NEW_KINDS = ["sentence_mc", "listen", "cloze_mc"]; // 새로 넣은 유형은 한 세트에 1~2개씩 섞이게
  // 손으로 쓴 문제가 있는 항목부터 정해야 상황형 몫이 단어 문제에 밀리지 않는다
  const order = items.map((it, i) => i).sort((a, b) => authoredFor(items[b]).length - authoredFor(items[a]).length);
  const out = [];
  for (const i of order) {
    const it = items[i];
    const all = questionsFor(it);
    let qs = all.filter(q => (typeN[TYPE_OF(q.kind)] || 0) < typeCap && !(IS_TILE(q.kind) && tiles >= tileCap));
    if (!qs.length) qs = all.filter(q => !IS_TILE(q.kind) || tiles < tileCap);
    if (!qs.length) qs = all;
    if (!qs.length) continue; // 지금 설정으로 낼 수 있는 문제가 없는 항목은 건너뛴다
    const score = q => {
      let s = Math.random() + staleness(q);
      if (q.kind === "situation" || q.kind === "translate") s += situ < targetSitu ? 2 : -.5;
      if (q.id) s += .6; // 손으로 쓴 문제를 조금 더 우선
      if (NEW_KINDS.includes(TYPE_OF(q.kind))) s += (typeN[TYPE_OF(q.kind)] || 0) < 2 ? 1.2 : -.5;
      s += IS_MC(q.kind) ? (mc < n - targetBuild ? 1 : 0) : (build < targetBuild ? 1 : 0);
      return s;
    };
    const q = qs.slice().sort((a, b) => score(b) - score(a))[0];
    typeN[TYPE_OF(q.kind)] = (typeN[TYPE_OF(q.kind)] || 0) + 1;
    if (IS_TILE(q.kind)) tiles++;
    if (IS_MC(q.kind)) mc++; else build++;
    if (q.kind === "situation" || q.kind === "translate") situ++;
    out[i] = Object.assign({ section: "review" }, q);
  }
  return out.filter(Boolean);
}

// 말하기 연습: 카드로 문장 만들기 + '이 상황에서 뭐라고 말할까' 고르기를 섞는다 (서로 다른 문법)
function pickSpeak(n, reviewItems, reviewQs) {
  const used = new Set(reviewItems.map(it => it.h));
  const usedIds = new Set(reviewQs.map(q => q.id).filter(Boolean));
  // 복습에 이미 나온 항목, 아직 복습 날이 안 된 항목(오늘 푼 것 등)은 뒤로 — 같은 날 세트를 또 풀어도 말하기가 되풀이되지 않게
  const notYet = q => { const it = byH.get(q.item); return isSeen(it.id) && !isDue(it.id); };
  const recent = q => staleness(q) < -2; // 최근 일주일 안에 본 문장은 말하기에서도 뒤로
  const rank = list => shuffle(list).sort((a, b) => (used.has(a.item) - used.has(b.item)) || (recent(a) - recent(b)) || (notYet(a) - notYet(b)) || (priority(byH.get(a.item)) - priority(byH.get(b.item))));
  const nTile = Math.max(1, n - 1), tags = new Set(), tilesOut = [], sitOut = []; // 3문제면 카드 2 + 고르기 1
  const usedItems = new Set(); // 한 항목에 말하기 문제가 여럿(태그만 다름)이어도 한 세트에는 하나만
  for (const q of rank(AUTHORED.filter(q => q.kind === "speak" && byH.has(q.item)))) {
    if (tilesOut.length >= nTile) break;
    if (tags.has(q.tag) || usedItems.has(q.item)) continue;
    tags.add(q.tag); usedItems.add(q.item); tilesOut.push(q);
  }
  for (const q of rank(AUTHORED.filter(q => q.kind === "situation" && byH.has(q.item) && !usedIds.has(q.id) && !usedItems.has(q.item)))) {
    if (tilesOut.length + sitOut.length >= n) break;
    if (tags.has(q.tag)) continue;
    tags.add(q.tag); sitOut.push(q);
  }
  // 카드 문제 사이에 고르기 문제를 끼워 연달아 나오지 않게
  const out = [];
  while (tilesOut.length || sitOut.length) { if (tilesOut.length) out.push(tilesOut.shift()); if (sitOut.length) out.push(sitOut.shift()); }
  return out.map(q => Object.assign({ section: "speak", itemId: byH.get(q.item).id }, q,
    q.choices ? mcOf(q.choices[q.answer], q.choices.filter((c, i) => i !== q.answer)) : {}));
}
// 카드 문제가 연달아 나오지 않게, 복습 마지막(말하기 바로 앞)에도 오지 않게 자리를 바꾼다
function spreadTiles(list) {
  for (let i = 1; i < list.length; i++) {
    if (!(IS_TILE(list[i].kind) && IS_TILE(list[i - 1].kind))) continue;
    const j = list.findIndex((q, k) => k > i && !IS_TILE(q.kind) && !(k + 1 < list.length && IS_TILE(list[k + 1].kind)));
    if (j > 0) [list[i], list[j]] = [list[j], list[i]];
  }
  const last = list.length - 1;
  if (last > 0 && IS_TILE(list[last].kind)) {
    const j = list.findIndex((q, k) => k < last && !IS_TILE(q.kind) && !(k > 0 && IS_TILE(list[k - 1].kind)) && !IS_TILE(list[k + 1].kind));
    if (j >= 0) [list[last], list[j]] = [list[j], list[last]];
  }
  return list;
}

function newSession(short) {
  const nReview = short ? 8 : 12, nSpeak = short ? 2 : 3;
  const picked = pickItems(nReview + 4);
  const items = picked.slice(0, nReview), spare = picked.slice(nReview);
  const assigned = assignQuestions(items);
  // 카드 문제밖에 없는 항목(어순 패턴 등) 때문에 복습 쪽 카드 문제가 1개를 넘으면 예비 항목의 다른 유형으로 바꾼다
  let over = assigned.filter(q => IS_TILE(q.kind)).length - 1;
  while (over > 0 && spare.length) {
    const sp = spare.shift(), alt = questionsFor(sp).filter(q => !IS_TILE(q.kind));
    if (!alt.length) continue;
    const k = assigned.map(q => IS_TILE(q.kind)).lastIndexOf(true);
    items[items.findIndex(it => it.id === assigned[k].itemId)] = sp;
    assigned[k] = Object.assign({ section: "review" }, alt[rnd(alt.length)]);
    over--;
  }
  const review = spreadTiles(shuffle(assigned));
  const speak = pickSpeak(nSpeak, items, review);
  const topics = {};
  items.forEach(it => { const tp = topic(it.src); topics[tp] = (topics[tp] || 0) + 1; });
  const top = Object.entries(topics).sort((a, b) => b[1] - a[1]).slice(0, 2).map(x => x[0]);
  const qs = review.concat(speak);
  if (!qs.length) return false; // 데이터를 못 불러온 경우 — 빈 세트를 '전부 맞힘'으로 기록하지 않는다
  db.session = { v: SESSION_V, date: today(), qs, idx: 0, res: [], focus: top.join("·") };
  save();
  return true;
}
// 세션을 끝낸다: 답한 문제만 복습 기록에 반영하고, 절반 넘게 풀었으면 그날을 '복습한 날'로 남긴다
// (결과 화면을 안 보고 닫거나, 자정을 넘기거나, 새로 시작해도 푼 기록이 사라지지 않게)
function finalize(ses) {
  if (!ses || ses.applied) return;
  applyResults(ses);
  ses.applied = true;
  const answered = ses.res.filter(r => r && r !== "skip").length;
  if (answered >= Math.ceil(ses.qs.length / 2) && !db.days.includes(ses.date)) db.days.push(ses.date);
  db.days = db.days.slice(-400); // 기록이 끝없이 늘지 않게 최근 것만 남긴다
  save();
}
// 아직 다 안 푼 세션 (날짜가 지나도 이어 풀 수 있다)
function openSession() {
  const s = db.session;
  return s && !s.applied && s.idx < s.qs.length ? s : null;
}

// ---------- 오답 노트 ----------
// 틀린(힌트 받고 맞힌 것 포함) 항목마다 마지막으로 틀린 문제와 내가 낸 답을 남긴다. 틀린 횟수·지금 상태는 prog 의 wc·last
function answerText(q) { return q.choices ? q.choices[q.answer] : q.accept ? q.accept[0] : (q.full || {}).h || ""; }
// 10/17 사용자 요청으로 바뀐 규칙: 틀린 단어는 다음 복습에서 맞혀도 노트에 계속 쌓인다.
// 20개(NOTE_GOAL)쯤 모이면 '오답 퀴즈'를 권하고, 오답 퀴즈에서 맞히면 풀려서(빠져서) 없어지고, 또 틀리면 r(차수)이 올라 '2차 오답'이 된다
const NOTE_GOAL = 20;
function notePut(id, q, mine, date, again) {
  const old = db.notes[id];
  const r = old ? (old.r || 1) + (again ? 1 : 0) : 1;
  db.notes[id] = { d: date, k: q.kind, pr: q.prompt, s: q.sentence || q.showH || "", l: q.listen || "", a: answerText(q), m: mine || [], f: q.full || null, r, o: 1 };
  const ids = Object.keys(db.notes);
  if (ids.length > 400) ids.sort((a, b) => db.notes[a].d.localeCompare(db.notes[b].d)).slice(0, ids.length - 400).forEach(k => delete db.notes[k]);
}
// 예전(10/17 전) 노트는 '지금 틀린 상태'만 보여 줘서 지난 회차 오답이 숨어 있었다 → 남아 있는 기록을 모두 1차 오답으로 다시 연다
function upgradeNotes() {
  for (const id in db.notes) { const n = db.notes[id]; if (n && n.o == null) { n.o = 1; n.r = n.r || 1; } }
}
upgradeNotes();
// 아직 안 풀린 오답. 차수 높은 것(2차 이상) 먼저, 그다음 최근에 틀린 순
function noteItems() {
  const n = it => db.notes[it.id];
  return ITEMS.filter(it => n(it) && n(it).o)
    .sort((a, b) => (n(b).r || 1) - (n(a).r || 1) || n(b).d.localeCompare(n(a).d) || prog(b.id).wc - prog(a.id).wc);
}
// 오답 퀴즈 — 답할 때마다 바로 기록하고(중간에 나가도 남는다), 연속 복습일에는 세지 않는다
let practiceSes = null;
function newPractice(only) {
  // 오래 묵은 것·여러 번 틀린 것부터 최대 20개 (결과 화면에서는 방금 틀린 단어만: only)
  const n = it => db.notes[it.id];
  const items = noteItems().filter(it => hasQuestions(it) && (!only || only.includes(it.id)))
    .sort((a, b) => (n(b).r || 1) - (n(a).r || 1) || prog(b.id).wc - prog(a.id).wc || n(a).d.localeCompare(n(b).d)).slice(0, NOTE_GOAL);
  if (!items.length) return false;
  practiceSes = { practice: true, date: today(), qs: spreadTiles(shuffle(assignQuestions(items))), idx: 0, res: [], wrong: [] };
  return true;
}
function applyPractice(ses, i) {
  const q = ses.qs[i], r = ses.res[i];
  if (!r || r === "skip" || !q.itemId) return;
  const p = Object.assign({}, prog(q.itemId));
  // 바로 맞히면 오답 노트에서 풀린다. 복습 날짜는 그대로 두고 정해진 날 복습에서 한 번 더 확인한다
  if (r === "ok") { p.last = "ok"; delete db.notes[q.itemId]; }
  else { p.wc += 1; p.lv = Math.max(0, p.lv - 1); p.rc = 0; p.due = addDays(today(), 1); p.last = "bad"; notePut(q.itemId, q, ses.wrong[i], today(), true); }
  db.prog[q.itemId] = p; save();
}

// ---------- 채점 (나중에 Claude 채점으로 바꿀 자리) ----------
function grade(q, ans) {
  if (q.choices) return { ok: ans === q.answer };
  if (q.accept) {
    const ok = q.accept.some(a => norm(a) === norm(ans));
    return { ok, why: ok ? "" : diagnose(norm(ans), norm(q.accept[0])) };
  }
  if (q.answers) {
    const got = ans.join("");
    const k = q.answers.findIndex(seq => seq.join("") === got);
    return { ok: k >= 0, k };
  }
  return { ok: false };
}
// 카드 문제에서 왜 틀렸는지 (10/25 사용자: 힌트가 내가 틀린 이유와 안 맞는다)
// 필요 없는 카드를 썼는지 → 빠진 카드가 있는지 → 카드는 맞고 순서만 다른지
function tileWhy(q, got) {
  const need = new Set(q.answers.flat());
  const extra = [...new Set(got.filter(t => !need.has(t)))];
  if (extra.length) return `${extra.map(t => `'${t}'`).join(", ")} 카드는 이 문장에 안 맞아요.`;
  const counts = a => a.reduce((m, t) => (m[t] = (m[t] || 0) + 1, m), {});
  const same = q.answers.some(a => { const x = counts(a), y = counts(got); return Object.keys(x).length === Object.keys(y).length && Object.keys(x).every(k => x[k] === y[k]); });
  if (same) return "카드는 맞게 골랐어요. 순서만 다시 생각해 보세요.";
  if (!q.answers.some(a => a.length <= got.length)) return "빠진 카드가 있어요.";
  return "";
}
function diagnose(got, want) {
  if (!got) return "";
  const other = ITEMS.find(it => ZH_ONLY(it.h) === got);
  if (other) return `입력한 ${got}(${other.p})는 '${dm(other)}'${josa(dm(other), "이라는", "라는")} 뜻이에요. 다른 단어를 떠올렸어요.`;
  if (got.length === want.length) {
    const diff = [...got].filter((c, i) => c !== want[i]).length;
    if (diff === 1) return "글자 하나만 달라요. 비슷한 글자를 고른 것 같아요.";
  }
  if ([...got].some(c => want.includes(c))) return "일부 글자는 맞았어요. 비슷한 글자가 섞였는지 확인해 보세요.";
  return "다른 단어를 떠올린 것 같아요.";
}

// ---------- 발음 듣기 ----------
const canSpeak = "speechSynthesis" in window;
// 이 기기에 중국어 음성이 있는지: null = 아직 모름(음성 목록을 불러오는 중), true/false
let ZH_VOICE = canSpeak ? null : false;
function zhVoice() {
  // 광둥어(zh-HK) 음성은 표준어 발음이 아니라서 쓰지 않는다
  const vs = speechSynthesis.getVoices().filter(v => !/HK|yue|cantonese/i.test(v.lang + " " + v.name));
  return vs.find(v => /^zh[-_]CN/i.test(v.lang)) || vs.find(v => /^(zh|cmn)/i.test(v.lang));
}
// 발음 듣기 버튼은 중국어 음성이 없다고 확인된 기기에서는 숨긴다
function canHear() { if (ZH_VOICE === null) checkVoices(); return canSpeak && ZH_VOICE !== false; }
function checkVoices() {
  if (!canSpeak) return;
  const vs = speechSynthesis.getVoices();
  if (vs.length) ZH_VOICE = !!zhVoice();
}
// 듣기 문제는 중국어 음성이 확인된 기기에서, 사용자가 끄지 않았을 때만 낸다
function listenOn() { if (ZH_VOICE === null) checkVoices(); return S.listen !== false && ZH_VOICE === true; }
if (canSpeak && speechSynthesis.addEventListener) speechSynthesis.addEventListener("voiceschanged", checkVoices);
function say(text, rate) {
  if (!canSpeak) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[A-Za-z가-힣+~]/g, ""));
    u.lang = "zh-CN"; u.rate = rate || .8;
    const v = zhVoice();
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ---------- 연속 학습일 ----------
function streak() {
  const days = new Set(db.days);
  let d = today(), n = 0;
  if (!days.has(d)) d = addDays(d, -1); // 오늘 아직 안 했으면 어제까지의 연속 기록을 보여 준다
  while (days.has(d)) { n++; d = addDays(d, -1); }
  return n;
}
function StreakRow() {
  const n = streak(), doneToday = db.days.includes(today());
  const t = today(), dow = (new Date(t + "T00:00:00").getDay() + 6) % 7; // 월요일 = 0
  const monday = addDays(t, -dow);
  const week = el("div", { class: "week", "aria-label": "이번 주 복습한 날" }, [..."월화수목금토일"].map((name, i) => {
    const d = addDays(monday, i);
    // 도장은 날마다 조금씩 비뚤게
    return el("span", { class: (db.days.includes(d) ? "on" : "") + (d === t ? " today" : ""), title: d, style: `--r:${[-9, 6, -4, 10, -7, 4, -12][i]}deg` }, name);
  }));

    ? el("div", { class: "line" }, el("b", null, "이번 주 공부 도장"), el("small", null, "공부한 날마다 도장을 찍어요"))

  return el("div", { class: "streak" }, line, week);

<text class="d" x="60" y="${two ? 99 : 91}" font-size="10" text-anchor="middle">${+date.slice(5, 7)}.${+date.slice(8, 10)}</text></svg>`; // 날짜는 잉크 번짐 없이 또렷하게

function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = el("canvas", { class: "confetti", "aria-hidden": "true" });
  document.body.append(cv);
  const ctx = cv.getContext("2d"), dpr = window.devicePixelRatio || 1;
  const W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const colors = ["--accent", "--ok", "--warn", "--bad"].map(v => css.getPropertyValue(v).trim()).concat(["#f2c14e", "#7aa7e0"]);
  const parts = Array.from({ length: 110 }, () => ({
    x: W / 2 + (Math.random() - .5) * W * .3, y: H * .32,
    vx: (Math.random() - .5) * 9, vy: -Math.random() * 11 - 4,
    w: 6 + Math.random() * 6, h: 4 + Math.random() * 4,
    r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3, c: colors[rnd(colors.length)]
  }));
  const t0 = performance.now();
  let last = t0;
  setTimeout(() => cv.remove(), 3200); // 탭이 가려져 애니메이션이 멈춰도 꽃가루가 남지 않게
  (function frame(t) {
    const life = (t - t0) / 2600;
    const k = Math.min(3, (t - last) / 16.7); // 화면 주사율과 상관없이 같은 속도로 움직이게
    last = t;
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = Math.max(0, 1 - Math.max(0, life - .6) / .4);
    for (const p of parts) {
      p.vy += .32 * k; p.vx *= Math.pow(.99, k); p.x += p.vx * k; p.y += p.vy * k; p.r += p.vr * k;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
    if (life < 1) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}

  const it = byId.get(q.itemId);
  let tries = 0, done = false, typedAlt = null;
  // 틀린 답을 남겨 두었다가 오답 노트에 '내 답'으로 보여 준다 (한 문제에 두 번까지)
  const mine = v => { ses.wrong = ses.wrong || []; (ses.wrong[ses.idx] = ses.wrong[ses.idx] || []).push(String(v).trim()); };

  // 진행은 원고지 칸처럼 — 푼 칸은 결과대로 채운다 (맞힘 남색 · 힌트 노랑 · 틀림 빨강)
  const cells = el("div", { class: "cells", role: "img", "aria-label": `${total}문제 중 ${no}번째` },
    ses.qs.map((x, i) => el("i", { class: i < ses.idx ? ses.res[i] || "" : i === ses.idx ? "now" : "" })));
  const head = el("div", null,
    el("div", { class: "top" },
      ses.practice
        ? el("button", { class: "back", "aria-label": "오답 노트로", onclick: () => WrongNote() }, "←")
        : el("button", { class: "back", "aria-label": "처음 화면으로", onclick: Home }, "←"),
      cells,
      el("span", { class: "count" }, `${no} / ${total}`)
    )
  );
  // 문제 위에는 지시문만 크게. 유형·주제 태그는 빼고, 말하기 연습·오답 다시 풀기일 때만 작은 표시
  const label = q.section === "speak" ? "🗣 말하기 연습" : ses.practice ? "📒 오답 퀴즈" : "";
  const body = el("div", { class: "card qcard" }, label ? el("p", { class: "qlabel" }, label) : null, el("p", { class: "prompt" }, q.prompt));
  if (q.showH) body.append(el("div", { class: "big-zh" }, q.showH));
  if (q.sentence) body.append(el("div", { class: "sentence" }, q.sentence));
  if (q.showP) body.append(el("div", { class: "big-py" }, q.showP));
  if (q.listen) {
    // 다음 문제 버튼을 누른 그 동작 안에서 바로 읽어야 휴대폰(특히 아이폰)에서 소리가 난다
    say(q.listen);
    body.append(el("div", { class: "listen" },
      el("button", { class: "play", "aria-label": "다시 듣기", onclick: () => say(q.listen) }, "🔊"),
      el("div", null,
        el("div", { class: "note" }, "버튼을 누르면 다시 들려요"),
        el("button", { class: "speak", onclick: () => say(q.listen, .55) }, "🐢 천천히 듣기"))));
  }
  const fb = el("div");
  const next = el("button", { class: "btn", onclick: goNext }, no === total ? "결과 보기" : "다음 문제 →");

  // 답 입력 영역
  let submit, area, onDone = () => {};
  if (q.choices) {
    const zhChoices = /hanzi_mc|fill_mc|cloze_mc|situation|listen_word/.test(q.kind);
    const btns = q.choices.map((c, i) => el("button", { class: "choice" + (zhChoices ? " zhc" : ""), onclick: () => submit(i) },
      el("span", { class: "n" }, i + 1), el("span", null, c)));
    area = el("div", { class: "choices" }, btns);
    if (q.listen) {
      // 소리가 안 나면 이 문제는 기록 없이 넘긴다. 무음 모드일 수도 있으니 듣기 문제를 아예 끌지는 물어본다
      const skip = el("button", { class: "link", onclick: () => {
        if (done) return;
        if (confirm("휴대폰이 무음 모드면 소리가 안 나요. 무음을 풀어도 안 들리면 '확인'을 눌러 듣기 문제를 꺼 주세요.\n('취소'를 누르면 이 문제만 넘어가요)")) {
          S.listen = false;
          // 이번 세트에 남은 듣기 문제도 뺀다
          ses.qs = ses.qs.filter((x, k) => k <= ses.idx || !x.listen);
        }
        ses.res[ses.idx] = "skip"; ses.idx++; save(); Quiz(ses);
      } }, "소리가 안 들려요 — 넘어가기");
      // 10/17 사용자: 소리가 이상한 문제가 있다 → 눌러 두면 이 말은 듣기 문제로 다시 안 나오고, 설정에 목록이 남는다
      const odd = el("button", { class: "link", onclick: () => {
        if (done) return;
        S.odd = [...new Set((S.odd || []).concat(ZH_ONLY(q.listen)))];
        ses.res[ses.idx] = "skip"; ses.idx++; save(); Quiz(ses);
      } }, "소리가 이상해요 — 이 문제 빼기");
      area = el("div", null, area, el("div", { style: "text-align:center" }, skip, odd));
    }
    submit = i => {
      if (done || fresh()) return;
      const r = grade(q, i);
      if (r.ok) { btns[i].classList.add("right"); return finish(tries ? "hint" : "ok"); }
      mine(q.choices[i]);
      const why = (q.why || {})[q.choices[i]] || "";
      btns[i].classList.add("picked"); btns[i].disabled = true;
      bump(area, "shake");
      if (tries === 0) {
        tries = 1;
        const wrong = btns.filter((b, k) => k !== q.answer && !b.disabled);
        shuffle(wrong).slice(0, Math.max(0, wrong.length - 1)).forEach(b => { b.classList.add("gone"); b.disabled = true; });
        btns[i].classList.add("gone");
        showHint(why);
      } else { btns[q.answer].classList.add("right"); finish("miss", why); }
    };
  } else if (q.accept) {
    const inp = el("input", { class: "answer", type: "text", autocomplete: "off", autocapitalize: "off", spellcheck: "false", lang: "zh-CN", placeholder: "간체자로 입력" });
    const go = el("button", { class: "btn mt", onclick: () => submit() }, "확인");
    inp.addEventListener("keydown", e => {
      if (e.key !== "Enter" || e.isComposing || e.keyCode === 229) return; // 중국어 입력기의 후보 확정 엔터는 무시
      e.preventDefault(); // 이 엔터가 '다음 문제' 버튼까지 눌러 버리지 않게 막는다
      submit();
    });
    // 모르겠으면 정답을 바로 본다 (틀린 것으로 기록). 키보드 설정을 끈 뒤 이어 풀 때 빠져나갈 길도 된다
    const giveUp = el("button", { class: "link", onclick: () => {
      if (done) return;
      mine("모르겠어요");
      go.remove(); giveUp.remove(); inp.disabled = true; finish("miss");
    } }, "모르겠어요 — 정답 보기");
    const warn = el("p", { class: "note", style: "color:var(--bad);text-align:center;min-height:1.6em;margin:6px 0 0" });
    area = el("div", null, inp, warn, go, el("div", { style: "text-align:center" }, giveUp));
    submit = () => {
      if (done || !norm(inp.value)) return inp.focus();
      // 한글·알파벳만 들어오면(키보드 전환 깜빡, 입력기 조합 중 확인) 기회를 쓰지 않는다
      if (!/[一-鿿]/.test(inp.value)) { warn.textContent = "중국어 키보드로 간체자를 입력해 주세요."; return inp.focus(); }
      warn.textContent = "";
      const r = grade(q, inp.value);
      if (r.ok) {
        // 10/31 사용자: 星期 문제에 周를 써서 맞았는데 정답 화면엔 星期만 떠서 헷갈림 → 쓴 말도 정답인 이유를 보여 준다
        const typed = norm(inp.value);
        if (typed !== norm(q.accept[0])) typedAlt = typed;
        go.remove(); giveUp.remove(); inp.disabled = true; return finish(tries ? "hint" : "ok");
      }
      mine(inp.value);
      bump(inp, "shake");
      if (tries === 0) { tries = 1; showHint(r.why); inp.select(); }
      else { go.remove(); giveUp.remove(); inp.disabled = true; finish("miss", r.why); }
    };
    setTimeout(() => inp.focus(), 50);
  } else {
    // 카드 배열
    const slots = el("div", { class: "slots" }), pool = el("div", { class: "pool" });
    let seq = [];
    const tiles = shuffle(q.tiles.map((t, i) => ({ t, i })));
    const poolBtns = tiles.map(o => el("button", { class: "tile", onclick: () => pick(o) }, o.t));
    pool.append(...poolBtns);
    function pick(o) {
      if (done || fresh() || seq.includes(o)) return;
      seq.push(o); poolBtns[tiles.indexOf(o)].classList.add("used"); draw();
    }
    function unpick(o) {
      if (done) return;
      seq = seq.filter(x => x !== o); poolBtns[tiles.indexOf(o)].classList.remove("used"); draw();
    }
    function draw() { fill(slots, seq.map(o => el("button", { class: "tile", onclick: () => unpick(o) }, o.t))); go.disabled = !seq.length; }
    const reset = () => { seq.slice().forEach(unpick); };
    const go = el("button", { class: "btn", disabled: true, onclick: () => submit() }, "확인");
    const row = el("div", { class: "row" }, el("button", { class: "btn ghost", onclick: reset }, "다시 놓기"), go);
    area = el("div", null, slots, pool, row);
    onDone = () => { pool.remove(); row.remove(); }; // 답한 뒤에는 남은 카드와 버튼을 치운다
    submit = () => {
      if (done || !seq.length) return;
      const r = grade(q, seq.map(o => o.t));
      if (r.ok) return finish(tries ? "hint" : "ok", null, r.k);
      mine(seq.map(o => o.t).join(" "));
      bump(slots, "shake");
      const why = tileWhy(q, seq.map(o => o.t));
      if (tries === 0) { tries = 1; showHint(why); reset(); }
      else finish("miss", why);
    };
  }
  // 직접 쓰는 문제는 힌트를 입력칸 위에 — 휴대폰 키보드가 올라와 있어도 보이게
  if (q.accept) body.append(fb, area); else body.append(area, fb);

  function showHint(why) {
    if (q.listen) say(q.listen, .55); // 듣기 문제의 힌트는 천천히 한 번 더
    fill(fb, el("div", { class: "feedback hint" },
      el("h3", null, "아쉬워요, 한 번 더!"),
      why ? el("p", { class: "note" }, why) : null,
      el("p", { class: "note" }, el("b", null, "힌트 "), q.hint || "다시 생각해 보세요.")
    ));
  }
  function finish(result, why, k) {
    done = true;
    onDone();
    ses.combo = result === "ok" ? (ses.combo || 0) + 1 : 0;
    cells.children[ses.idx].className = result;
    if (result === "ok") bump(body, "pop");
    const cls = result === "ok" ? "ok" : result === "hint" ? "hint" : "bad";
    const title = result === "ok"
      ? [Tick(), "정답이에요!", ses.combo >= 3 ? el("span", { class: "combo" }, `🔥 ${ses.combo}연속 정답`) : null]
      : result === "hint" ? "힌트 받고 맞혔어요" : "정답을 확인해 보세요";
    let full = q.full || fullOf(it);
    const extra = [];
    if (q.alts && q.alts.length) {
      // 맞힌 순서의 문장을 크게 보여 주고, 나머지 정답은 '이렇게도 맞아요'로 붙인다
      const all = [full].concat(q.alts.map(a => ({ h: a.h, p: a.p, m: full.m })));
      const main = k > 0 && all[k] ? k : 0;
      full = all[main];
      all.filter((x, i) => i !== main).forEach(x =>
        extra.push(el("p", { class: "note" }, el("b", null, "이렇게도 맞아요 "), el("span", { class: "zh" }, x.h), ` ${x.p}`)));
    }
    if (q.explain) extra.push(el("p", { class: "note" }, q.explain));
    if (it && !q.explain) {
      const tp = tonePattern(it.p);
      if (tp) extra.push(el("p", { class: "note" }, el("b", null, "성조 "), tp));
      if (it.pron && it.pron.length) extra.push(el("p", { class: "note" }, el("b", null, "발음 주의 "), it.pron.join(" · ")));
      if (it.ex && it.ex.includes(" / ")) extra.push(el("p", { class: "note zh" }, el("b", null, "예문 "), it.ex));
    }
    // 정답 확인은 화면 아래에서 올라오는 창으로 — 스크롤 없이 '다음' 버튼을 엄지로 바로 누르게
    // 이렇게도 맞아요·해설·성조·발음 주의·예문은 '해설 더 보기'에 접어 둔다 (펼치면 다음 문제에서도 펼친 채로)
    const extraBox = extra.length ? el("div", { class: "extra", hidden: !S.more }, extra) : null;
    const moreLabel = () => (S.more ? "해설 접기 ▴" : "해설 더 보기 ▾");
    const more = extra.length ? el("button", { class: "more", "aria-expanded": String(!!S.more), onclick: () => {
      S.more = !S.more; save();
      extraBox.hidden = !S.more; more.textContent = moreLabel(); more.setAttribute("aria-expanded", String(S.more));
      fit();
    } }, moreLabel()) : null;
    const report = reportBox(ses, q, it, full, result, () => fit());
    const rubyPy = alignPy(full.h, full.p);
    const sheet = el("div", { class: "sheet " + cls, role: "status" }, el("div", { class: "sheet-in" },
      el("h3", null, title),
      why && result === "miss" ? el("p", { class: "note" }, why) : null,
      typedAlt ? el("p", { class: "note" }, el("b", null, "이렇게 써도 정답 "),
        el("span", { class: "zh" }, typedAlt), byH.get(typedAlt) ? ` ${byH.get(typedAlt).p}` : "",
        " — ", el("span", { class: "zh" }, `${q.accept[0]} = ${typedAlt}`), ", 뜻이 같아요.") : null,
      el("div", { class: "full" },
        // 병음은 글자마다 위에 단다 (글자와 음절 수가 안 맞는 항목 이름 등은 예전처럼 아래 한 줄로)
        rubyPy ? el("div", { class: "zh rb" }, rubyPy.map(([c, r]) => (r === null ? c : el("ruby", null, c, el("rt", null, r))))) : el("div", { class: "zh" }, full.h),
        rubyPy ? null : el("div", { class: "py" }, full.p),
        el("div", null, full.m),
        canHear() ? el("button", { class: "speak", onclick: () => say(full.h) }, "🔊 발음 듣기") : null
      ),
      more, extraBox, next, report
    ));
    fill(fb); // 힌트 상자는 치운다
    app.append(sheet);
    // 창에 가려지는 만큼 아래 여백을 두고, 방금 푼 문제가 창 위로 보이게 올린다
    function fit() {
      app.style.paddingBottom = sheet.offsetHeight + 20 + "px";
      const r = body.getBoundingClientRect(), over = r.bottom - (innerHeight - sheet.offsetHeight - 12);
      if (over > 0) window.scrollBy({ top: Math.min(over, Math.max(0, r.top - 12)), behavior: "smooth" });
    }
    fit();
    ses.res[ses.idx] = result; save();
    if (ses.practice) applyPractice(ses, ses.idx);
    // 확인에 쓴 키 입력이 끝난 뒤에 초점을 옮긴다 — 다음 엔터 한 번으로 다음 문제로 간다
    setTimeout(() => next.focus({ preventScroll: true }), 0);
  }
  function goNext() { ses.idx++; save(); Quiz(ses); }
  // 10/19 사용자: 전 문제로 돌아가기 — 지난 문제를 다시 볼 수만 있다 (다시 풀면 기록이 꼬이니 답은 못 바꾼다)
  const prev = ses.idx > 0 ? el("button", { class: "link prevq", onclick: () => PastQ(ses, ses.idx - 1) }, "‹ 전 문제 다시 보기") : null;
  mount(head, body, prev);
}

// 지난 문제 보기: 문제·내가 고른 답·정답·해설. '지금 문제로'를 누르면 풀던 자리로 돌아간다
function PastQ(ses, i) {
  const q = ses.qs[i], r = ses.res[i], it = byId.get(q.itemId);
  const mine = ((ses.wrong || [])[i] || []).map(String);
  const back = () => Quiz(ses);
  const tag = { ok: ["ok", "바로 맞힘"], hint: ["hint", "힌트 받고 맞힘"], miss: ["bad", "틀림"], skip: ["", "넘어감"] }[r] || ["", "안 풂"];
  const card = el("div", { class: "card qcard" },
    el("p", { class: "qlabel" }, `지난 문제 · ${i + 1}번`, tag[1] ? " · " + tag[1] : ""),
    el("p", { class: "prompt" }, q.prompt));
  if (q.showH) card.append(el("div", { class: "big-zh" }, q.showH));
  if (q.sentence) card.append(el("div", { class: "sentence" }, q.sentence));
  if (q.showP) card.append(el("div", { class: "big-py" }, q.showP));
  if (q.listen && canHear()) card.append(el("button", { class: "speak", onclick: () => say(q.listen) }, "🔊 문제 다시 듣기"));
  const zhc = /hanzi_mc|fill_mc|cloze_mc|situation|listen_word/.test(q.kind);
  if (q.choices) card.append(el("div", { class: "choices" }, q.choices.map((c, k) =>
    el("button", { class: "choice" + (zhc ? " zhc" : "") + (k === q.answer ? " right" : mine.includes(c) ? " picked" : ""), disabled: true },
      el("span", { class: "n" }, k === q.answer ? "✓" : mine.includes(c) ? "✗" : k + 1), el("span", null, c)))));
  else if (mine.length) card.append(el("p", { class: "note" }, el("b", null, "내 답 "), el("span", { class: "zh" }, mine.join(", "))));
  const full = q.full || (it ? fullOf(it) : null);
  if (full) {
    const ruby = alignPy(full.h, full.p);
    card.append(el("div", { class: "full" },
      ruby ? el("div", { class: "zh rb" }, ruby.map(([c, py]) => (py === null ? c : el("ruby", null, c, el("rt", null, py))))) : el("div", { class: "zh" }, full.h),
      ruby ? null : el("div", { class: "py" }, full.p),
      el("div", null, full.m),
      canHear() ? el("button", { class: "speak", onclick: () => say(full.h) }, "🔊 발음 듣기") : null));
  }
  if (q.explain) card.append(el("p", { class: "note" }, q.explain));
  mount(
    el("div", { class: "top" },
      el("button", { class: "back", "aria-label": "지금 문제로", onclick: back }, "←"),
      el("h1", { style: "margin:0;font-size:1.2em" }, "지난 문제")),
    card,
    el("div", { class: "row" },
      i > 0 ? el("button", { class: "btn ghost", onclick: () => PastQ(ses, i - 1) }, "‹ 그 전 문제") : null,
      el("button", { class: "btn", onclick: back }, "지금 문제로 →"))
  );
}

function applyResults(ses) {
  const base = ses.date, seen = {}, missAt = {}; // 시작한 날 기준 (자정을 넘겨 끝내도 간격이 하루 밀리지 않게)
  ses.qs.forEach((q, i) => {
    const r = ses.res[i]; if (!r || r === "skip" || !q.itemId) return; // 소리가 안 나서 넘긴 문제는 기록하지 않는다
    const sk = sentKey(q); if (sk) (db.shown = db.shown || {})[sk] = base; // 이 문장을 마지막으로 본 날
    // 한 항목이 여러 번 나왔으면 하나라도 틀렸을 때 틀린 것으로 본다
    seen[q.itemId] = seen[q.itemId] === "bad" || r !== "ok" ? "bad" : "ok";
    if (r !== "ok") missAt[q.itemId] = i;
  });
  for (const id in missAt) notePut(id, ses.qs[missAt[id]], (ses.wrong || [])[missAt[id]], base);
  for (const [id, r] of Object.entries(seen)) {
    const p = Object.assign({}, prog(id));
    // 맞히면 복습 횟수 +1 → 1회 3일, 2회 7일, 3회 14일, 4회 이상 30일 (원래 노션 퀴즈와 같은 방식)
    if (r === "ok") { p.rc += 1; p.lv = Math.min(2, p.lv + 1); p.due = addDays(base, INTERVAL[Math.min(p.rc, 4)]); }
    else { p.wc += 1; p.lv = Math.max(0, p.lv - 1); p.rc = 0; p.due = addDays(base, 1); }
    p.last = r;
    db.prog[id] = p;
  }
}

function Results() {
  const ses = db.session;
  if (!ses) return Home();
  const first = !ses.applied;
  finalize(ses);
  const answered = ses.res.filter(r => r && r !== "skip").length;
  const n = ses.qs.length, cnt = { ok: 0, hint: 0, miss: 0 };
  ses.res.forEach(r => { if (r in cnt) cnt[r]++; });
  const missed = ses.qs.map((q, i) => ({ q, r: ses.res[i] })).filter(x => x.r === "hint" || x.r === "miss");
  const leave = () => { db.session = null; save(); };
  // 결과: ① 몇 개 맞혔는지 + 도장 ② 맞힘·힌트·틀림 ③ 이번 주 도장 ④ 다시 볼 단어 ⑤ 틀린 단어 바로 다시 풀기
  mount(
    el("div", { class: "rhead" },
      el("h1", null, answered && cnt.ok === answered ? "전부 맞혔어요! 🎉" : "오늘 공부 끝!"),
      el("p", { class: "sub" }, `${n}문제 중 ${cnt.ok}문제를 바로 맞혔어요`),
      answered ? Stamp(cnt.ok, answered, ses.date) : null),
    el("div", { class: "card" },
      el("div", { class: "stat" },
        el("div", null, el("b", { style: "color:var(--ok)" }, cnt.ok), el("span", null, "맞힘")),
        el("div", null, el("b", { style: "color:var(--warn)" }, cnt.hint), el("span", null, "힌트 받고")),
        el("div", null, el("b", { style: "color:var(--bad)" }, cnt.miss), el("span", null, "틀림"))
      ),
      el("p", { class: "note mt", style: "color:var(--muted)" }, missed.length
        ? "틀린 단어는 내일, 맞힌 단어는 3일 뒤에 다시 나와요."
        : "맞힌 단어는 3일 뒤에 다시 나와요. 맞힐수록 간격이 길어져요.")
    ),
    el("div", { class: "card" }, StreakRow()),
    missed.length ? el("div", { class: "card" },
      el("p", { class: "label" }, "다시 볼 단어"),
      el("ul", { class: "list" }, missed.map(({ q, r }) => {
        const f = q.full || fullOf(byId.get(q.itemId));
        return el("li", null,
          el("div", null, el("span", { class: "zh" }, f.h), el("span", { class: "tag " + (r === "hint" ? "hint" : "bad") }, r === "hint" ? "힌트 후 맞힘" : "틀림")),
          el("div", { class: "note", style: "color:var(--muted)" }, f.p),
          el("div", { class: "note" }, f.m),
          canHear() ? el("button", { class: "speak", onclick: () => say(f.h) }, "🔊 듣기") : null
        );
      }))
    ) : null,
    missed.length ? el("button", { class: "btn", onclick: () => { leave(); startPractice(missed.map(x => x.q.itemId)); } }, "틀린 단어 다시 풀기") : null,
    el("button", { class: missed.length ? "btn ghost" : "btn", onclick: () => { leave(); Home(); } }, "처음으로")
  );
  if (first) setTimeout(confetti, 150);
}

// ---------- 오답 노트 화면 ----------
// 지금 틀린 상태인 단어만 모은다. 다시 맞히면 빠진다
function WrongNote() {
  const list = noteItems(), canPractice = list.filter(hasQuestions).length;
  mount(
    el("div", { class: "top" },
      el("button", { class: "back", "aria-label": "처음 화면으로", onclick: Home }, "←"),
      el("h1", { style: "margin:0" }, "오답 노트")),
    el("p", { class: "sub" }, `틀린 단어가 계속 쌓여요. ${NOTE_GOAL}개쯤 모이면 오답 퀴즈로 정리해요. 오답 퀴즈에서 맞히면 풀리고, 또 틀리면 2차 오답이 돼요.`),
    canPractice ? el("button", { class: "btn", style: "margin-bottom:14px", onclick: () => startPractice() }, `오답 퀴즈 풀기 · ${Math.min(NOTE_GOAL, canPractice)}문제`) : null,
    list.length ? noteSections(list) : el("div", { class: "card" },
      el("p", { class: "note", style: "margin:0;text-align:center;color:var(--muted)" }, "지금은 틀린 단어가 없어요. 👏"))
  );
}
// 차수별로 나눠 보여 준다: 2차 이상 오답(오답 퀴즈에서도 틀린 것) → 1차 오답
function noteSections(list) {
  const r = it => db.notes[it.id].r || 1;
  const out = [];
  [...new Set(list.map(r))].sort((a, b) => b - a).forEach(k => {
    const part = list.filter(it => r(it) === k);
    out.push(el("p", { class: "label nsec" }, `${k}차 오답 · ${part.length}개`), part.map(NoteCard));
  });
  return out;
}
// 단어 · 뜻, 그리고 '내 답 / 정답'. 문장으로 물어본 문제였으면 그 문장
function NoteCard(it) {
  const p = prog(it.id), n = db.notes[it.id];
  const sent = n && n.f && n.f.h !== it.h ? n.f : null;
  const sayWhat = sent ? sent.h : it.h.replace(/[^一-鿿，。？！]/g, "");
  const zhCls = t => (/[一-鿿]/.test(t) ? "zh" : "");
  const mine = n && n.m ? n.m.filter((x, i) => n.m.indexOf(x) === i) : []; // 두 번 똑같이 틀렸으면 한 번만
  return el("div", { class: "card ncard" },
    el("div", { class: "nhead" },
      el("div", null, el("span", { class: "zh nzh" }, it.h), el("div", { class: "py" }, it.p)),
      sayWhat && canHear() ? el("button", { class: "play small", "aria-label": "발음 듣기", onclick: () => say(sayWhat) }, "🔊") : null),
    el("div", null, it.m, p.wc >= 2 ? el("span", { class: "tag bad" }, `${p.wc}번 틀림`) : null,
      n && n.d ? el("span", { class: "tag day" }, koDate(n.d).replace(/^\d+년 /, "").replace(/ \(.\)/, "")) : null),
    n ? el("div", { class: "nmiss" },
      el("p", { class: "q" }, KIND_LABEL[n.k] || ""),
      mine.length ? el("div", { class: "nrow mine" }, el("b", null, "내 답"), el("span", { class: zhCls(mine.join("")) }, mine.join(", "))) : null,
      el("div", { class: "nrow right" }, el("b", null, "정답"), el("span", { class: zhCls(n.a) }, n.a)),
      sent ? el("div", { class: "nsent" },
        n.a === sent.h ? null : el("div", { class: "zh" }, sent.h),
        el("div", { class: "py" }, sent.p),
        sent.m === n.a ? null : el("div", null, sent.m)) : null
    ) : null
  );
}
function startPractice(only) {
  if (!newPractice(only)) return alert("다시 풀 오답이 없어요.");
  Quiz(practiceSes);
}
function PracticeDone(ses) {
  practiceSes = null;
  const cnt = { ok: 0, hint: 0, miss: 0 };
  ses.res.forEach(r => { if (r in cnt) cnt[r]++; });
  const answered = cnt.ok + cnt.hint + cnt.miss;
  mount(
    el("div", { class: "rhead" },
      el("h1", null, answered && cnt.ok === answered ? "전부 맞혔어요! 🎉" : "오답 퀴즈 끝!"),
      el("p", { class: "sub" }, `${ses.qs.length}문제`),
      answered ? Stamp(cnt.ok, answered, today()) : null),
    el("div", { class: "card" },
      el("div", { class: "stat" },
        el("div", null, el("b", { style: "color:var(--ok)" }, cnt.ok), el("span", null, "바로 맞힘")),
        el("div", null, el("b", { style: "color:var(--warn)" }, cnt.hint), el("span", null, "힌트 후")),
        el("div", null, el("b", { style: "color:var(--bad)" }, cnt.miss), el("span", null, "틀림"))
      ),
      cnt.ok || answered - cnt.ok ? el("p", { class: "note mt" },
        [cnt.ok ? `바로 맞힌 ${cnt.ok}개는 오답 노트에서 풀렸어요.` : "", answered - cnt.ok ? ` 다시 틀린 ${answered - cnt.ok}개는 한 차수 올라가 노트에 남았어요.` : ""].join("").trim()) : null
    ),
    el("button", { class: "btn", onclick: () => WrongNote() }, "📒 오답 노트로"),
    el("button", { class: "btn ghost", onclick: Home }, "처음으로")
  );
  if (answered && cnt.ok === answered) setTimeout(confetti, 150);
}

// 시작할 때 저장된 세션 정리: 형식이 바뀐 옛 세션, 다 풀고 결과를 안 본 세션은 푼 것만 기록해 둔다
if (db.session && (db.session.v !== SESSION_V || !Array.isArray(db.session.qs))) {
  try { finalize(db.session); } catch (e) {}
  db.session = null; save();
} else if (db.session && !db.session.applied && db.session.idx >= db.session.qs.length) {
  finalize(db.session);
}
applyBig();
if (canSpeak) speechSynthesis.getVoices();
Home();
})();
</script>
</body>
